<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>color ball battle — arena</title>
<style>
  :root {
    --bone: #a9a9c3;      /* light territory */
    --void: #221f3e;      /* dark territory  */
    --ref: #8a8aa8;       /* neutral referee tone, a 50/50 mix of both */
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bone);
    font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  canvas { display: block; }

  /* ---- hud ---- */
  #bar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    width: min(900px, 70vw); height: 30px;
    background: var(--void); border: 2px solid var(--ref);
    pointer-events: none; user-select: none;
  }
  #fillL {
    position: absolute; top: 0; bottom: 0; left: 0; width: 50%;
    background: var(--bone); transition: width 0.25s ease-out;
  }
  #bar .notch { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ref); }
  #bar .pct {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 18px; font-weight: 700; letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
  }
  #bar .pct.l { left: 12px; color: var(--void); }
  #bar .pct.r { right: 12px; color: var(--bone); }
  /* block counts ride along the white/blue boundary */
  #bar .cnt {
    position: absolute; top: 50%;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #bar .cnt.l { color: var(--void); transform: translate(-100%, -50%); }
  #bar .cnt.r { color: var(--bone); transform: translate(0, -50%); }

  .chip.clock {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center; min-width: 100px;
    padding: 8px 18px; border: 2px solid var(--ref);
    background: rgba(34, 31, 62, 0.85); color: var(--bone);
    font-variant-numeric: tabular-nums; pointer-events: none; user-select: none;
  }
  .chip.clock b { font-size: 24px; line-height: 1; }
  .chip.clock.sd {
    background: var(--bone); color: var(--void); border-color: var(--void);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .chip.clock.last10 { animation: pulse 0.55s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  #event {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    padding: 4px 12px; border: 2px solid var(--ref);
    background: rgba(34, 31, 62, 0.85); color: var(--bone);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    pointer-events: none; user-select: none; white-space: nowrap;
  }
  #event:empty { display: none; }

  #sndHint {
    position: fixed; bottom: 18px; right: 18px;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(34, 31, 62, 0.55); pointer-events: none; user-select: none;
    transition: opacity 0.6s;
  }
  #sndHint.off { opacity: 0; }

  /* ---- match end ---- */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    pointer-events: none; user-select: none; text-align: center;
  }
  #overlay.hidden { display: none; }
  #winTxt { margin: 0; font-size: clamp(42px, 8vw, 96px); letter-spacing: 0.06em; }
  #winTxt.light { color: var(--bone); } #winTxt.dark { color: var(--void); }
  #finalScore { font-size: 22px; font-variant-numeric: tabular-nums; }
  #finalScore.light { color: var(--bone); } #finalScore.dark { color: var(--void); }
  #nextIn { margin-top: 14px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.75; }
  /* overlay text contrasts with the flood of the winning color */
  #winTxt.light, #finalScore.light, #nextIn.light { color: var(--bone); }
  #winTxt.dark, #finalScore.dark, #nextIn.dark { color: var(--void); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="bar">
  <div id="fillL"></div>
  <div class="notch" style="left: 15%"></div>
  <div class="notch" style="left: 85%"></div>
  <span class="pct l" id="pctL">50%</span>
  <span class="pct r" id="pctR">50%</span>
  <span class="cnt l" id="cntL"></span>
  <span class="cnt r" id="cntR"></span>
</div>
<div id="event"></div>
<div class="chip clock" id="clockChip"><b id="clock">10:00</b></div>
<div id="sndHint">click for sound &middot; m mute &middot; 1-5 music</div>

<div id="overlay" class="hidden">
  <div id="winTxt"></div>
  <div id="finalScore"></div>
  <div id="nextIn"></div>
</div>

<script>
// Two balls bounce in a block grid. Each converts blocks of the other color
// on impact. Neutral tokens give temporary boosts; a 15:00 match clock must
// produce a winner (most blocks), then the board resets after a short pause.
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const params = new URLSearchParams(location.search);
const MATCH_SECONDS = Number(params.get("m")) || 10 * 60;
const RESTART_SECONDS = Number(params.get("r")) || 10;
const MUSIC_IDX = Math.max(0, (Number(params.get("music")) || 1) - 1);

const TARGET_BLOCKS = 500;      // ~250 blocks per side on a 1080p screen
const BONE = "#a9a9c3", VOID = "#221f3e", REF = "#8a8aa8";
const COLORS = [BONE, VOID];
const BALL_COLORS = ["#f4f4f9", "#151228"];
const BALL_OUTLINE = ["rgba(34,31,62,.4)", "rgba(244,244,249,.4)"];
const BASE_SPEED = 368;

const TOKENS = {
  speed:  { glyph: "»", label: "speed",     speedMul: 2 },
  big:    { glyph: "O", label: "big ball",  sizeMul: 1.7 },
  multi:  { glyph: "+", label: "multiball" },
  ghost:  { glyph: "~", label: "ghost" },
  freeze: { glyph: "*", label: "freeze" },
  shrink: { glyph: "-", label: "shrink",   sizeMul: 0.55 },
  bomb:   { glyph: "@", label: "bomb", arm: 6 },
};
const TOKEN_KEYS = Object.keys(TOKENS);

// token tint = opposite side, blended 20% toward the ground so it never
// perfectly matches either field color
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (sh) => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const TOKEN_TONE = [0, 1].map((c) => mixHex(COLORS[1 - c], COLORS[c], 0.2));
const SUDDEN_DEATH_AT = 180; // last 3 minutes escalate

let W, H, cols, rows, grid;
let CELL = 40; // recomputed per screen size in resize()
let counts = [0, 0];
let balls = [], tokens = [], flashes = [], sparks = [];
let matchLeft = MATCH_SECONDS, restartIn = 0, overT = 0;
let clock = 0;                    // sim-time seconds, advances only during play
let state = "play";               // "play" | "over"
let winner = 0, sd = false, nextTokenIn = 6, lastTick = -1;
let eventTxt = "", eventUntil = 0;

const el = (id) => document.getElementById(id);
const hud = { clock: el("clock"), chip: el("clockChip"),
              ev: el("event"), ov: el("overlay"), win: el("winTxt"), fin: el("finalScore"), next: el("nextIn"),
              fillL: el("fillL"), pctL: el("pctL"), pctR: el("pctR"), cntL: el("cntL"), cntR: el("cntR") };

// ---- audio: everything synthesized with Web Audio, no files, works offline ----
// browsers block audio until the first click/keypress — see unlock below
const Sfx = {
  ctx: null, master: null, musicGain: null, muted: false, lastBounce: 0, lastWall: 0, lastClack: 0, lastPhase: 0, lastPow: 0,
  musicIdx: 0, musicStop: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.14;
    this.musicGain.connect(this.master);
    el("sndHint").classList.add("off");
    this.setMusic(MUSIC_IDX, true);
    // audible confirmation that audio is live
    this.tone(523.25, 0.12, { type: "triangle", gain: 0.12 });
    this.tone(783.99, 0.18, { type: "triangle", gain: 0.12, when: 0.1 });
  },
  tone(freq, dur, { type = "sine", gain = 0.15, when = 0, slide = 0, dest } = {}) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, { gain = 0.3, freq = 1000, dest } = {}) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.max(1, (this.ctx.sampleRate * dur) | 0);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(100, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest || this.master);
    src.start(t); src.stop(t + dur);
  },
  bounce(color) {
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastBounce < 0.05) return; // impact storms would stack voices
    this.lastBounce = now;
    const base = color === 0 ? 520 : 300; // white side higher, blue side lower
    this.tone(base * (0.92 + Math.random() * 0.16), 0.07, { type: "square", gain: 0.05 });
  },
  wall() {
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastWall < 0.08) return;
    this.lastWall = now;
    this.tone(130, 0.06, { type: "sine", gain: 0.06 });
  },
  clack() {
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastClack < 0.1) return;
    this.lastClack = now;
    this.tone(900, 0.05, { type: "triangle", gain: 0.07 });
  },
  phase() { // ghost conversions: soft high blip, own throttle (cells fly by fast)
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastPhase < 0.06) return;
    this.lastPhase = now;
    this.tone(980 * (0.9 + Math.random() * 0.2), 0.05, { type: "sine", gain: 0.04 });
  },
  powerDown() { // effect wore off
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastPow < 0.12) return;
    this.lastPow = now;
    this.tone(420, 0.22, { type: "triangle", gain: 0.08, slide: -220 });
  },
  grab(k) {
    const base = { speed: 660, big: 440, multi: 550, ghost: 740, freeze: 392, shrink: 494, bomb: 220 }[k] || 500;
    this.tone(base, 0.1, { type: "triangle", gain: 0.16 });
    this.tone(base * 1.5, 0.14, { type: "triangle", gain: 0.16, when: 0.09 });
  },
  boom() {
    this.noise(0.7, { gain: 0.5, freq: 900 });
    this.tone(70, 0.5, { type: "sine", gain: 0.4, slide: -40 });
  },
  sting() { // sudden death
    this.tone(110, 0.9, { type: "sawtooth", gain: 0.11 });
    this.tone(113.5, 0.9, { type: "sawtooth", gain: 0.11 }); // slow beating
  },
  tick() { this.tone(880, 0.05, { type: "square", gain: 0.06 }); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.35, { type: "triangle", gain: 0.18, when: i * 0.13 }));
  },
  // soft-attack pad voice shared by several styles
  pad(freq, t, dur, { type = "sawtooth", gain = 0.05, attack = 2.2, cutoff = 900 } = {}) {
    const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
    const g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o1.type = type; o2.type = type;
    o1.frequency.value = freq; o2.frequency.value = freq * 1.005; // gentle detune
    f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = 0.5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.musicGain);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  },
  setMusic(idx, quiet) {
    if (!this.ctx) return;
    if (this.musicStop) this.musicStop();
    this.musicIdx = idx % this.MUSIC.length;
    const st = this.MUSIC[this.musicIdx];
    this.musicGain.gain.value = 0.14 * (st.vol || 1);
    this.musicStop = st.start.call(this);
    if (!quiet) announce(`music: ${st.name}`);
  },
  // styles marked `reroll` pick a fresh variation at every match start
  onNewMatch() {
    if (this.ctx && this.MUSIC[this.musicIdx].reroll) this.setMusic(this.musicIdx, true);
  },
  MUSIC: [
    { name: "ambient", vol: 1, // slow detuned pads + sparse plucks (the original)
      start() {
        const chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7], [164.8, 196, 246.9]];
        const scale = [440, 523.25, 587.33, 659.25, 783.99];
        let step = 0;
        const tick = () => {
          if (this.muted || document.hidden) return;
          const t = this.ctx.currentTime + 0.05;
          chords[step % chords.length].forEach((f) => this.pad(f, t, 5.5, { attack: 0.8 }));
          if (Math.random() < 0.75) this.tone(scale[(Math.random() * scale.length) | 0], 1.2, { type: "sine", gain: 0.06, when: t - this.ctx.currentTime + Math.random() * 2, dest: this.musicGain });
          step++;
        };
        tick();
        const iv = setInterval(tick, 4000);
        return () => clearInterval(iv);
      } },
    { name: "lo-fi", vol: 1, // warm 7th chords, lazy melody, vinyl crackle
      start() {
        const chords = [[220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [130.8, 164.8, 196, 246.9], [196, 246.9, 293.7, 349.2]];
        const mel = [523.25, 587.33, 659.25, 783.99, 880];
        // crackle: looped sparse noise
        const len = this.ctx.sampleRate;
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.01 ? 1 : 0.06);
        const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const bp = this.ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 4000;
        const cg = this.ctx.createGain(); cg.gain.value = 0.4;
        src.connect(bp); bp.connect(cg); cg.connect(this.musicGain);
        src.start();
        let bar = 0;
        const tick = () => {
          if (this.muted || document.hidden) return;
          const t = this.ctx.currentTime + 0.05;
          chords[bar % chords.length].forEach((f) => this.pad(f, t, 7, { type: "triangle", gain: 0.035, attack: 1.5, cutoff: 650 }));
          [0.9, 2.3, 3.6, 5.0].forEach((off) => {
            if (Math.random() < 0.6) this.tone(mel[(Math.random() * mel.length) | 0], 1.1, { type: "sine", gain: 0.05, when: t - this.ctx.currentTime + off, dest: this.musicGain });
          });
          bar++;
        };
        tick();
        const iv = setInterval(tick, 6000);
        return () => { clearInterval(iv); try { src.stop(); } catch {} };
      } },
    { name: "synthwave", vol: 0.8, reroll: true, // a random variant each match
      start() {
        const variants = [
          { label: "classic", step: 125, roots: [110, 87.31, 65.41, 98],
            arps: [[220, 261.6, 329.6, 440], [174.6, 220, 261.6, 349.2], [130.8, 164.8, 196, 261.6], [196, 246.9, 293.7, 392]] },
          { label: "night drive", step: 250, kick: 16, bass: 4, arpStep: 2, arpType: "triangle", arpGain: 0.022, cutoff: 700,
            roots: [73.42, 65.41, 58.27, 73.42],
            arps: [[146.8, 174.6, 220], [130.8, 164.8, 196], [116.5, 146.8, 174.6], [130.8, 164.8, 196]] },
          { label: "turbo", step: 95, bass: 1, bassOct: true, arpStep: 1, arpType: "square", arpGain: 0.024,
            roots: [82.41, 65.41, 73.42, 61.74],
            arps: [[164.8, 196, 246.9, 329.6], [130.8, 164.8, 196, 261.6], [146.8, 174.6, 220, 293.7], [123.5, 146.8, 185, 246.9]] },
          { label: "pulse", step: 133, kickOff: true, bass: 8, bassSync: [0, 3, 6], arpStep: 2, arpType: "sawtooth", arpGain: 0.014, cutoff: 1000,
            roots: [110, 98, 87.31, 82.41],
            arps: [[220, 261.6, 329.6, 392], [196, 246.9, 293.7, 349.2], [174.6, 220, 261.6, 329.6], [164.8, 207.7, 246.9, 311.1]] },
        ];
        let vi;
        do { vi = (Math.random() * variants.length) | 0; } while (vi === this._synthLast); // never the same twice in a row
        this._synthLast = vi;
        const v = variants[vi];
        announce(`synthwave: ${v.label}`);
        let s = 0;
        const iv = setInterval(() => {
          if (this.muted || document.hidden) return;
          const bar = (s / 16) | 0, st = s % 16;
          const root = v.roots[bar % 4], ch = v.arps[bar % 4];
          const kick = v.kickOff ? st % 8 === 4 : st % (v.kick || 8) === 0;
          if (kick) this.tone(120, 0.12, { type: "sine", gain: 0.35, slide: -80, dest: this.musicGain });
          const onBeat = v.bassSync ? v.bassSync.includes(st % 8) : st % v.bass === 0;
          if (onBeat) {
            const oct = v.bassOct && st % 4 === 2 ? 2 : 1;
            this.tone(root * oct, 0.22, { type: "sawtooth", gain: 0.09, dest: this.musicGain });
          }
          if (s % v.arpStep === 0) this.tone(ch[((s / v.arpStep) | 0) % ch.length] * 2, 0.09, { type: v.arpType || "square", gain: v.arpGain ?? 0.016, dest: this.musicGain });
          if (st === 0) ch.forEach((f) => this.pad(f, this.ctx.currentTime + 0.03, (v.step * 16) / 1000 + 1, { gain: 0.02, attack: 0.4, cutoff: v.cutoff || 1200 }));
          s++;
        }, v.step);
        return () => clearInterval(iv);
      } },
    { name: "chiptune", vol: 0.9, // 8-bit square lead + bass + noise hats
      start() {
        const A = [659.25, 783.99, 880, 783.99, 659.25, 523.25, 587.33, 659.25];
        const B = [523.25, 587.33, 659.25, 523.25, 440, 493.88, 523.25, 0];
        const lead = [...A, ...A, ...B, ...A];
        const bass = [130.81, 130.81, 98, 98, 87.31, 87.31, 98, 98];
        let s = 0;
        const iv = setInterval(() => {
          if (this.muted || document.hidden) return;
          const st = s % 32;
          if (lead[st]) this.tone(lead[st], 0.12, { type: "square", gain: 0.05, dest: this.musicGain });
          if (st % 4 === 0) this.tone(bass[(st / 4) | 0], 0.13, { type: "square", gain: 0.05, dest: this.musicGain });
          if (st % 2 === 1) this.noise(0.03, { gain: 0.015, freq: 6000, dest: this.musicGain });
          s++;
        }, 140);
        return () => clearInterval(iv);
      } },
    { name: "deep drone", vol: 1.1, // ominous low fifth-drone, distant booms
      start() {
        const oscs = [];
        const mk = (freq, gain, lfoHz) => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
          o.type = "sawtooth"; o.frequency.value = freq;
          f.type = "lowpass"; f.frequency.value = 260;
          g.gain.value = gain;
          const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
          lfo.frequency.value = lfoHz; lg.gain.value = gain * 0.5;
          lfo.connect(lg); lg.connect(g.gain);
          o.connect(f); f.connect(g); g.connect(this.musicGain);
          o.start(); lfo.start();
          oscs.push(o, lfo);
        };
        mk(55, 0.05, 0.06); mk(82.5, 0.035, 0.045); mk(110.3, 0.02, 0.08);
        let n = 0;
        const tick = () => {
          if (this.muted || document.hidden) return;
          if (n % 2 === 0) this.tone(46, 2.8, { type: "sine", gain: 0.22, slide: -16, dest: this.musicGain });
          if (Math.random() < 0.35) this.tone(1244.5, 3, { type: "sine", gain: 0.012, dest: this.musicGain });
          n++;
        };
        tick();
        const iv = setInterval(tick, 4000);
        return () => { clearInterval(iv); oscs.forEach((o) => { try { o.stop(); } catch {} }); };
      } },
  ],
};
// first gesture unlocks audio (autoplay policy); M toggles mute
function unlockAudio() {
  Sfx.init();
  if (Sfx.ctx && Sfx.ctx.state === "suspended") Sfx.ctx.resume();
}
addEventListener("pointerdown", unlockAudio);
addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "m" || e.key === "M") {
    Sfx.muted = !Sfx.muted;
    if (Sfx.master) Sfx.master.gain.value = Sfx.muted ? 0 : 0.5;
  }
  if (e.key >= "1" && e.key <= "5") Sfx.setMusic(Number(e.key) - 1);
});

function announce(text, dur = 10) { eventTxt = text; eventUntil = clock + dur; }

function makeBall(color, x, y, temp = false, dieAt = 0) {
  // random diagonal-ish heading so the motion never looks flat
  const a = (Math.random() * 50 + 20) * (Math.PI / 180);
  const q = Math.random() < 0.5 ? 1 : -1;
  return {
    color, x, y, temp, dieAt,
    spd: BASE_SPEED * (0.85 + Math.random() * 0.3),
    vx: Math.cos(a) * q, vy: Math.sin(a) * (Math.random() < 0.5 ? 1 : -1),
    speedUntil: 0, bigUntil: 0, ghostUntil: 0, frozenUntil: 0, shrinkUntil: 0,
    rallyUntil: 0, armed: false, armedUntil: 0, lastArmTick: 0, fx: null, fxUntil: 0,
    lastX: x, lastY: y, lastMoveT: 0, prevFx: 0,
  };
}

function recount() {
  counts = [0, 0];
  for (let i = 0; i < grid.length; i++) counts[grid[i]]++;
}

function reset() {
  cols = Math.ceil(W / CELL); rows = Math.ceil(H / CELL);
  grid = new Uint8Array(cols * rows);
  // even split: dark blue territory on the right, blocky staircase edge
  for (let row = 0; row < rows; row++) {
    const edge = Math.floor(cols * 0.5) + ((Math.random() * 5) | 0) - 2;
    for (let col = edge; col < cols; col++) grid[row * cols + col] = 1;
  }
  recount();
  balls = [
    makeBall(0, W * 0.25, H * 0.5),
    makeBall(1, W * 0.75, H * 0.4),
  ];
  tokens = []; flashes = []; sparks = [];
  for (let i = 0; i < 5; i++) spawnToken();
  matchLeft = MATCH_SECONDS; clock = 0; state = "play";
  sd = false; nextTokenIn = 2; lastTick = -1;
  Sfx.onNewMatch();
  eventTxt = ""; eventUntil = 0;
  hud.ov.classList.add("hidden");
  hud.chip.classList.remove("sd", "last10");
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CELL = Math.max(24, Math.round(Math.sqrt((W * H) / TARGET_BLOCKS)));
  reset();
}

function ballRadius(b) {
  return CELL * 0.45 * (b.bigUntil > clock ? TOKENS.big.sizeMul : 1)
                      * (b.shrinkUntil > clock ? TOKENS.shrink.sizeMul : 1);
}
function ballSpeed(b) {
  if (b.frozenUntil > clock) return 0;
  let s = b.spd;
  if (b.speedUntil > clock) s *= TOKENS.speed.speedMul;
  if (b.rallyUntil > clock) s *= 1.2; // multiball squad bonus
  if (sd) s *= 1 + 0.5 * (1 - matchLeft / SUDDEN_DEATH_AT); // sudden-death ramp
  return s;
}

function overlappingCell(b, r) {
  // only blocks of the OTHER color are solid; own color is open floor
  const c0 = Math.max(0, ((b.x - r) / CELL) | 0), c1 = Math.min(cols - 1, ((b.x + r) / CELL) | 0);
  const r0 = Math.max(0, ((b.y - r) / CELL) | 0), r1 = Math.min(rows - 1, ((b.y + r) / CELL) | 0);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      const i = row * cols + col;
      if (grid[i] === b.color) continue;
      const cx = Math.max(col * CELL, Math.min(b.x, col * CELL + CELL));
      const cy = Math.max(row * CELL, Math.min(b.y, row * CELL + CELL));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy < r * r) return i;
    }
  }
  return -1;
}

function flipCell(i, color) {
  if (grid[i] === color) return;
  counts[grid[i]]--; counts[color]++;
  grid[i] = color;
}

function convertAround(b, r) {
  // flip every enemy cell the circle touches (ghost phasing, bomb blasts)
  const c0 = Math.max(0, ((b.x - r) / CELL) | 0), c1 = Math.min(cols - 1, ((b.x + r) / CELL) | 0);
  const r0 = Math.max(0, ((b.y - r) / CELL) | 0), r1 = Math.min(rows - 1, ((b.y + r) / CELL) | 0);
  for (let row = r0; row <= r1; row++) {
    for (let col = c0; col <= c1; col++) {
      const i = row * cols + col;
      if (grid[i] === b.color) continue;
      const cx = Math.max(col * CELL, Math.min(b.x, col * CELL + CELL));
      const cy = Math.max(row * CELL, Math.min(b.y, row * CELL + CELL));
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy < r * r) flipCell(i, b.color);
    }
  }
}

function detonate(b) {
  b.armed = false;
  convertAround(b, CELL * 3.5);
  flashes.push({ x: b.x, y: b.y, at: clock, big: true });
  Sfx.boom();
  announce(`${b.color === 0 ? "WHITE" : "BLUE"} detonates @ bomb`);
}

function step(b, dt) {
  const r = ballRadius(b), sp = ballSpeed(b);
  const ghost = b.ghostUntil > clock;
  // substep so the ball can never tunnel through a block
  const dist = sp * dt;
  const steps = Math.max(1, Math.ceil(dist / (CELL * 0.4)));
  const sx = (b.vx * sp * dt) / steps, sy = (b.vy * sp * dt) / steps;

  for (let s = 0; s < steps; s++) {
    b.x += sx;
    let hit = overlappingCell(b, r);
    if (hit >= 0) {
      if (ghost) { flipCell(hit, b.color); Sfx.phase(); } // phase through, converting as we go
      else { b.x -= sx; b.vx = -b.vx; flipCell(hit, b.color); Sfx.bounce(b.color); if (b.armed) detonate(b); }
    }
    b.y += sy;
    hit = overlappingCell(b, r);
    if (hit >= 0) {
      if (ghost) { flipCell(hit, b.color); Sfx.phase(); }
      else { b.y -= sy; b.vy = -b.vy; flipCell(hit, b.color); Sfx.bounce(b.color); if (b.armed) detonate(b); }
    }
    if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx); Sfx.wall(); }
    if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx); Sfx.wall(); }
    if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy); Sfx.wall(); }
    if (b.y > H - r) { b.y = H - r; b.vy = -Math.abs(b.vy); Sfx.wall(); }
  }
  if (ghost) convertAround(b, r);

  // token pickup
  for (let t = tokens.length - 1; t >= 0; t--) {
    const tk = tokens[t], dx = b.x - tk.x, dy = b.y - tk.y;
    if (dx * dx + dy * dy < (r + 14) * (r + 14)) {
      tokens.splice(t, 1);
      flashes.push({ x: tk.x, y: tk.y, at: clock });
      Sfx.grab(tk.k);
      applyToken(b, tk);
    }
  }
}

function applyToken(b, tk) {
  const k = tk.k, side = b.color === 0 ? "WHITE" : "BLUE";
  const dur = 10 + Math.random() * 5;   // most effects last 10–15s
  const shortDur = 5 + Math.random() * 3; // ghost & freeze burn out faster
  // the last-grabbed power's countdown is the one shown on the ball
  const mark = (o, until) => { o.fx = k; o.fxUntil = until; };
  if (k === "speed") { b.speedUntil = clock + dur; mark(b, clock + dur); }
  if (k === "big") { b.bigUntil = clock + dur; mark(b, clock + dur); }
  if (k === "ghost") { b.ghostUntil = clock + shortDur; mark(b, clock + shortDur); }
  if (k === "multi") {
    const n = 1 + ((Math.random() * 5) | 0); // 1–5 extra balls
    for (let i = 0; i < n; i++) {
      const extra = makeBall(b.color, b.x, b.y, true, clock + dur);
      const a = Math.random() * Math.PI * 2; // fan out in random directions
      extra.vx = Math.cos(a); extra.vy = Math.sin(a);
      balls.push(extra);
    }
    // whole squad gets +20% speed for the duration
    for (const o of balls) if (o.color === b.color) o.rallyUntil = clock + dur;
    mark(b, clock + dur);
    announce(`${side} grabs + ×${n} multiball & speed`);
    return;
  }
  if (k === "freeze") {
    for (const o of balls) if (o.color !== b.color) { o.frozenUntil = clock + shortDur; mark(o, clock + shortDur); }
  }
  if (k === "shrink") {
    for (const o of balls) if (o.color !== b.color) { o.shrinkUntil = clock + dur; mark(o, clock + dur); }
  }
  if (k === "bomb") {
    b.armed = true; // the next block impact sets off the blast
    b.armedUntil = clock + TOKENS.bomb.arm; // ...unless the fuse runs out first
    b.lastArmTick = TOKENS.bomb.arm;
    flashes.push({ x: tk.x, y: tk.y, at: clock });
  }
  announce(`${side} grabs ${TOKENS[k].glyph} ${TOKENS[k].label}`);
}

function spawnToken() {
  const k = TOKEN_KEYS[(Math.random() * TOKEN_KEYS.length) | 0];
  const m = CELL * 1.5;
  const min = CELL * 2; // minimum space between tokens (center to center)
  let x = 0, y = 0;
  for (let tries = 0; tries < 20; tries++) {
    x = m + Math.random() * (W - 2 * m);
    y = m + Math.random() * (H - 2 * m);
    const clear = tokens.every((t) => {
      const dx = t.x - x, dy = t.y - y;
      return dx * dx + dy * dy >= min * min;
    });
    if (clear) break;
  }
  tokens.push({
    k, x, y,
    phase: Math.random() * 6.28,
    ttl: 30 + Math.random() * 30, // unclaimed tokens expire and respawn elsewhere
  });
}

// balls bounce off each other (equal-mass elastic: swap velocities) so two
// balls can't share a pocket and deadlock the frontier
function ballCollisions() {
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const rr = ballRadius(a) + ballRadius(b);
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, push = (rr - d) / 2;
      a.x -= nx * push; a.y -= ny * push;
      b.x += nx * push; b.y += ny * push;
      const tvx = a.vx, tvy = a.vy;
      a.vx = b.vx; a.vy = b.vy;
      b.vx = tvx; b.vy = tvy;
      Sfx.clack();
    }
  }
}

// safety net: a ball that hasn't moved for 2.5s (trap/deadlock) is dropped
// into a random own-color cell
function relocate(b) {
  const own = [];
  for (let i = 0; i < grid.length; i++) if (grid[i] === b.color) own.push(i);
  const i = own[(Math.random() * own.length) | 0];
  b.x = ((i % cols) + 0.5) * CELL;
  b.y = (((i / cols) | 0) + 0.5) * CELL;
  const a = Math.random() * Math.PI * 2;
  b.vx = Math.cos(a); b.vy = Math.sin(a);
  b.lastX = b.x; b.lastY = b.y; b.lastMoveT = clock;
}

function checkStuck() {
  for (const b of balls) {
    if (b.frozenUntil > clock) { b.lastX = b.x; b.lastY = b.y; b.lastMoveT = clock; continue; }
    const dx = b.x - b.lastX, dy = b.y - b.lastY;
    if (dx * dx + dy * dy > 100) { b.lastX = b.x; b.lastY = b.y; b.lastMoveT = clock; }
    else if (clock - b.lastMoveT > 2.5) relocate(b);
  }
}

const fxMask = (b) =>
  (b.speedUntil > clock ? 1 : 0) | (b.bigUntil > clock ? 2 : 0) |
  (b.rallyUntil > clock ? 4 : 0) | (b.ghostUntil > clock ? 8 : 0) |
  (b.frozenUntil > clock ? 16 : 0) | (b.shrinkUntil > clock ? 32 : 0);

// little block-sparks: the one true "power wore off" moment
function wearOff(x, y) {
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 130;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45 + Math.random() * 0.35, size: 3 + Math.random() * 4 });
  }
  Sfx.powerDown();
}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
  }
}

function tickGame(dt) {
  clock += dt;
  matchLeft -= dt;

  if (!sd && MATCH_SECONDS > SUDDEN_DEATH_AT && matchLeft <= SUDDEN_DEATH_AT) {
    sd = true;
    announce("sudden death", 5);
    Sfx.sting();
    hud.chip.classList.add("sd");
  }
  // final countdown ticks
  if (matchLeft <= 10 && matchLeft > 0) {
    const s = Math.ceil(matchLeft);
    if (s !== lastTick) { lastTick = s; Sfx.tick(); }
  }
  if (matchLeft <= 10) hud.chip.classList.add("last10");

  // keep 5 tokens on the board; expired ones vanish and refill elsewhere
  for (let i = tokens.length - 1; i >= 0; i--) {
    tokens[i].ttl -= dt;
    if (tokens[i].ttl <= 0) tokens.splice(i, 1);
  }
  nextTokenIn -= dt;
  if (tokens.length < 5 && nextTokenIn <= 0) {
    spawnToken();
    nextTokenIn = sd ? 1 + Math.random() : 2 + Math.random() * 2;
  }

  for (const b of balls) step(b, dt);
  ballCollisions();
  checkStuck();

  // effect expiry -> wear-off burst; armed bombs defuse when the fuse runs out
  for (const b of balls) {
    const m = fxMask(b);
    if (b.prevFx & ~m) wearOff(b.x, b.y);
    b.prevFx = m;
    if (b.armed) {
      const s = Math.ceil(b.armedUntil - clock);
      if (s !== b.lastArmTick) { b.lastArmTick = s; if (s > 0) Sfx.tick(); }
      if (b.armedUntil <= clock) {
        b.armed = false;
        wearOff(b.x, b.y);
        announce(`${b.color === 0 ? "WHITE" : "BLUE"} bomb defused`);
      }
    }
  }
  // multiball extras expire into the same burst
  for (let i = balls.length - 1; i >= 0; i--) {
    if (balls[i].temp && balls[i].dieAt <= clock) { wearOff(balls[i].x, balls[i].y); balls.splice(i, 1); }
  }
  flashes = flashes.filter((f) => clock - f.at < 0.5);

  // domination win: one color takes 75% of the board
  const total = cols * rows;
  if (counts[0] >= total * 0.75 || counts[1] >= total * 0.75) { endMatch(); return; }

  if (matchLeft <= 0) endMatch();
}

function endMatch() {
  if (state === "over") return;
  state = "over";
  matchLeft = 0; overT = 0; restartIn = RESTART_SECONDS;
  winner = counts[0] === counts[1] ? (Math.random() < 0.5 ? 0 : 1) : counts[0] > counts[1] ? 0 : 1;
  tokens = [];
  Sfx.fanfare();
  hud.chip.classList.remove("sd", "last10");
  announce("");
}

function tickOver(dt) {
  overT += dt;
  restartIn -= dt;
  if (restartIn <= 0) reset();
}

function drawTokens() {
  ctx.font = `bold ${Math.round(CELL * 0.33)}px 'JetBrains Mono', monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const t of tokens) {
    // opposite color of the territory it sits in, slightly offset
    const i = ((t.y / CELL) | 0) * cols + ((t.x / CELL) | 0);
    const tone = TOKEN_TONE[grid[i]];
    // final 5 seconds: the seconds count down inside the diamond, pulsing harder
    const expiring = t.ttl < 5;
    const pulse = 1 + (expiring ? 0.28 : 0.14) * Math.sin(clock * 5 + t.phase);
    const s = CELL * 0.28 * pulse;
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(Math.PI / 4);
    ctx.strokeStyle = tone; ctx.lineWidth = 3;
    ctx.strokeRect(-s, -s, s * 2, s * 2);
    ctx.restore();
    ctx.fillStyle = tone;
    // center the glyph's actual ink (asterisks etc. sit high in the em box)
    const g = expiring ? String(Math.ceil(t.ttl)) : TOKENS[t.k].glyph;
    const m = ctx.measureText(g);
    ctx.fillText(g, t.x - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2, t.y - (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2);
  }
}

function draw() {
  ctx.fillStyle = COLORS[0];
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COLORS[1];
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      if (grid[row * cols + col] === 1) ctx.fillRect(col * CELL, row * CELL, CELL, CELL);
    }
  }

  if (state === "play") drawTokens();

  // pickup flashes: expanding referee ring (bigger for bombs)
  for (const f of flashes) {
    const p = (clock - f.at) / 0.5;
    ctx.strokeStyle = REF;
    ctx.globalAlpha = 1 - p;
    ctx.lineWidth = f.big ? 5 : 2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, CELL * 0.2 + p * (f.big ? CELL * 4 : CELL * 0.7), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // wear-off sparks: tiny falling blocks
  for (const s of sparks) {
    ctx.globalAlpha = Math.min(1, s.life * 2.5);
    ctx.fillStyle = REF;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;

  for (const b of balls) {
    let r = ballRadius(b);
    // extra balls pulse faster & harder over their last 5s
    if (b.temp && b.dieAt - clock < 5) {
      const k = 1 - Math.max(0, b.dieAt - clock) / 5;
      r *= 1 + (0.08 + 0.22 * k) * Math.abs(Math.sin(clock * (5 + 5 * k)));
    }
    ctx.globalAlpha = 1;
    if (b.speedUntil > clock || b.bigUntil > clock || b.rallyUntil > clock) {
      ctx.strokeStyle = BALL_OUTLINE[b.color]; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r + CELL * 0.18 + CELL * 0.05 * Math.sin(clock * 9), 0, Math.PI * 2);
      ctx.stroke();
    }
    if (b.frozenUntil > clock || b.shrinkUntil > clock) {
      ctx.strokeStyle = REF; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, r + CELL * 0.14, 0, Math.PI * 2); ctx.stroke();
    }
    if (b.ghostUntil > clock) ctx.setLineDash([CELL * 0.22, CELL * 0.16]);
    ctx.fillStyle = BALL_OUTLINE[b.color];
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.setLineDash([]);
    ctx.fillStyle = BALL_COLORS[b.color];
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.8, 0, Math.PI * 2); ctx.fill();
    if (b.armed) { // live bomb: blinking referee ring
      ctx.strokeStyle = REF;
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(clock * 6));
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, r + CELL * 0.2, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // countdown in the ball: the last-grabbed power's remaining seconds
    let fxLeft = null;
    if (b.armed) fxLeft = Math.max(0, Math.ceil(b.armedUntil - clock));
    else if (b.fx && b.fxUntil > clock) fxLeft = Math.ceil(b.fxUntil - clock);
    if (fxLeft !== null) {
      ctx.font = `bold ${Math.round(r * 0.78)}px 'JetBrains Mono', monospace`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = b.color === 0 ? "rgba(34, 31, 62, 0.9)" : "rgba(244, 244, 249, 0.9)";
      ctx.fillText(fxLeft, b.x, b.y);
    }
    ctx.globalAlpha = 1;
  }

  if (state === "over") {
    // the winning color floods the board
    ctx.globalAlpha = Math.min(1, Math.max(0, (overT - 0.3) / 1.1));
    ctx.fillStyle = COLORS[winner];
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function updateHud() {
  const wl = Math.round((counts[0] / (cols * rows)) * 100);
  hud.fillL.style.width = wl + "%";
  hud.pctL.textContent = wl + "%";
  hud.pctR.textContent = (100 - wl) + "%";
  hud.cntL.style.left = `calc(${wl}% - 5px)`;
  hud.cntR.style.left = `calc(${wl}% + 5px)`;
  hud.cntL.textContent = counts[0];
  hud.cntR.textContent = counts[1];

  if (state === "play") {
    const s = Math.max(0, Math.ceil(matchLeft));
    hud.clock.textContent = `${(s / 60) | 0}:${String(s % 60).padStart(2, "0")}`;
  } else {
    hud.clock.textContent = "0:00";
    hud.next.textContent = `next match in ${Math.max(0, Math.ceil(restartIn))}`;
  }

  const remain = eventUntil - clock;
  if (remain > 0) {
    hud.ev.textContent = eventTxt;
    hud.ev.style.opacity = Math.min(1, remain / 2); // fade out over the last 2s
  } else {
    hud.ev.style.opacity = 0;
  }

  if (state === "over" && overT > 1.2 && hud.ov.classList.contains("hidden")) {
    // text color contrasts with the flood, which uses the winner's color
    const tone = winner === 0 ? "dark" : "light";
    hud.win.textContent = winner === 0 ? "WHITE WINS" : "BLUE WINS";
    hud.win.className = tone;
    hud.fin.textContent = `white ${counts[0]} — blue ${counts[1]}`;
    hud.fin.className = tone;
    hud.next.className = tone;
    hud.ov.classList.remove("hidden");
  }
}

let prev = performance.now();
// physics on a timer so the sim advances even when the tab throttles rAF
function tick() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  updateSparks(dt);
  if (state === "play") tickGame(dt); else tickOver(dt);
}
setInterval(tick, 16);

function frame() {
  draw();
  updateHud();
  requestAnimationFrame(frame);
}

// double-click toggles fullscreen (screensaver use)
addEventListener("dblclick", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
addEventListener("resize", resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
